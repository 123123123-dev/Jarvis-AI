    <script>
      // Gracefully absorb harmless Vite HMR WebSocket closed errors in preview/iframe environment
      (function() {
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var msg = args.map(function(a) {
            return typeof a === 'object' && a !== null ? (a.message || a.stack || JSON.stringify(a)) : String(a);
          }).join(' ');
          if (
            msg.indexOf('WebSocket closed without opened') !== -1 ||
            (msg.indexOf('WebSocket') !== -1 && msg.indexOf('vite') !== -1) ||
            msg.indexOf('[vite] failed to connect to websocket') !== -1
          ) {
            return;
          }
          origConsoleError.apply(console, args);
        };
        window.addEventListener('error', function (e) {
          if (
            e.message &&
            (e.message.includes('WebSocket') || e.message.includes('ws') || e.message.includes('vite'))
          ) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        });
        window.addEventListener('unhandledrejection', function (e) {
          if (
            e.reason &&
            (String(e.reason).includes('WebSocket') || String(e.reason).includes('vite'))
          ) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        });
      })();
    </script>
  </head>
  <body class="bg-[#070b12] text-slate-100 antialiased selection:bg-cyan-500/30 selection:text-cyan-200 overflow-x-hidden">
    <div id="root"></div>

  </body>
