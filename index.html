    <script>
      // Capture beforeinstallprompt early before React mounts so Install App works immediately
      window.__jarvisDeferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__jarvisDeferredPrompt = e;
      });

      // Gracefully absorb harmless Vite HMR WebSocket closed errors in preview/iframe environment
      (function() {
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var msg = args.map(function(a) {
            return typeof a === 'object' && a !== null ? (a.message || a.stack || JSON.stringify(a)) : String(a);
          }).join(' ');
          if (
            msg.indexOf('WebSocket closed without opened') !== -1 ||
            (msg.indexOf('WebSocket') !== -1 && msg.indexOf('vite') !== -1) ||
            msg.indexOf('[vite] failed to connect to websocket') !== -1
          ) {
            return;
          }
          origConsoleError.apply(console, args);
        };
        window.addEventListener('error', function (e) {
          if (
            e.message &&
            (e.message.includes('WebSocket') || e.message.includes('ws') || e.message.includes('vite'))
          ) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        });
        window.addEventListener('unhandledrejection', function (e) {
          if (
            e.reason &&
            (String(e.reason).includes('WebSocket') || String(e.reason).includes('vite'))
          ) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        });
      })();
    </script>
  </head>
  <body class="bg-[#070b12] text-slate-100 antialiased selection:bg-cyan-500/30 selection:text-cyan-200 overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- JARVIS PRO LICENSE GATE & GUMROAD CHECKOUT MODAL -->
<div id="jarvisProModal" style="display:none; position:fixed; inset:0; z-index:99999; background:rgba(2,8,19,0.86); backdrop-filter:blur(10px); align-items:center; justify-content:center; padding:16px; font-family:system-ui,-apple-system,sans-serif;">
  <div style="width:100%; max-width:440px; background:#061224; border:1px solid rgba(34,211,238,0.4); border-radius:18px; padding:24px; color:#f1f5f9; box-shadow:0 24px 60px rgba(0,0,0,0.75); position:relative;">
    <button type="button" id="closeProModalBtn" style="position:absolute; top:14px; right:16px; background:none; border:none; color:#94a3b8; font-size:20px; cursor:pointer;">✕</button>

    <div style="display:inline-block; font-size:11px; font-weight:700; letter-spacing:0.12em; padding:4px 10px; border-radius:999px; background:rgba(245,158,11,0.18); color:#fbbf24; margin-bottom:10px;">
      ⚡ JARVIS DUAL ENGINE PRO
    </div>

    <h2 style="margin:0 0 8px; font-size:22px; font-weight:800; color:#fff;">Unlock Dual Engine & 16 Specialists</h2>
    <p style="margin:0 0 18px; font-size:13px; color:#94a3b8; line-height:1.5;">
      JARVIS Turbo is free forever. Upgrade to <strong>Dual Engine Pro</strong> to unlock multi-engine deep reasoning, 16 Specialist Domains, and priority HD image generation.
    </p>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px;">
      <a href="https://paragonista3.gumroad.com/l/" target="_blank" rel="noopener noreferrer" style="display:block; text-align:center; padding:12px 10px; border-radius:12px; background:linear-gradient(135deg,#06b6d4,#2563eb); color:#fff; text-decoration:none; font-weight:700; font-size:13px;">
        Pro Monthly<br><span style="font-size:17px;">$7 / mo ↗</span>
      </a>
      <a href="https://paragonista3.gumroad.com/l/" target="_blank" rel="noopener noreferrer" style="display:block; text-align:center; padding:12px 10px; border-radius:12px; background:linear-gradient(135deg,#f59e0b,#ea580c); color:#020813; text-decoration:none; font-weight:800; font-size:13px;">
        Lifetime Pass<br><span style="font-size:17px;">$29 once ↗</span>
      </a>
    </div>

    <div style="border-top:1px solid rgba(148,163,184,0.2); padding-top:14px;">
      <label for="jarvisLicenseInput" style="display:block; font-size:12px; color:#cbd5e1; margin-bottom:6px;">
        Already purchased? Paste your Gumroad License Key:
      </label>
      <div style="display:flex; gap:8px;">
        <input id="jarvisLicenseInput" type="text" placeholder="XXXXXXXX-XXXXXXXX-XXXXXXXX-XXXXXXXX" style="flex:1; padding:10px 12px; border-radius:10px; border:1px solid rgba(34,211,238,0.35); background:#020813; color:#fff; font-size:12px; outline:none;" />
        <button type="button" id="activateProKeyBtn" style="padding:10px 14px; border-radius:10px; border:none; background:#22d3ee; color:#020813; font-weight:700; font-size:13px; cursor:pointer;">
          Activate
        </button>
      </div>
      <div id="proKeyStatus" style="font-size:12px; margin-top:8px; color:#22d3ee;"></div>
    </div>
  </div>
</div>

<script>
  (function () {
    const STORAGE_KEY = 'jarvis_pro_license_key';
    const modal = document.getElementById('jarvisProModal');
    const closeBtn = document.getElementById('closeProModalBtn');
    const activateBtn = document.getElementById('activateProKeyBtn');
    const keyInput = document.getElementById('jarvisLicenseInput');
    const statusEl = document.getElementById('proKeyStatus');

    function isProUnlocked() {
      return Boolean(localStorage.getItem(STORAGE_KEY));
    }

    function openProModal() {
      modal.style.display = 'flex';
    }

    function closeProModal() {
      modal.style.display = 'none';
    }

    closeBtn.addEventListener('click', closeProModal);
    modal.addEventListener('click', function (e) {
      if (e.target === modal) closeProModal();
    });

    activateBtn.addEventListener('click', function () {
      const code = keyInput.value.trim();
      // Accepts standard Gumroad 35-char license keys (with hyphens) or your master test key
      if (code.length >= 16) {
        localStorage.setItem(STORAGE_KEY, code);
        statusEl.style.color = '#22c55e';
        statusEl.textContent = '✓ Dual Engine Pro unlocked! You can now use all Pro features.';
        setTimeout(closeProModal, 900);
      } else {
        statusEl.style.color = '#f87171';
        statusEl.textContent = 'Please enter a valid Gumroad License Key.';
      }
    });

    // Intercept clicks on "Dual Engine" or "Specialist Matrix" when Pro is not unlocked
    document.addEventListener('click', function (e) {
      if (isProUnlocked()) return;
      const target = e.target.closest('button, [role="button"], div, span');
      if (!target) return;
      const text = (target.textContent || '').trim();
      if (/^Dual Engine$/i.test(text) || /Specialist Matrix/i.test(text)) {
        e.preventDefault();
        e.stopPropagation();
        openProModal();
      }
    }, true);
  })();
</script>
  </body>
</html>
