<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="128" fill="#060b13"/>
  <defs>
    <radialGradient id="jarvisGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#0891b2" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#0e7490" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#060b13" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="220" fill="url(#jarvisGlow)"/>

  <!-- Outer Ring with ticks -->
  <circle cx="256" cy="256" r="180" stroke="#0891b2" stroke-width="3" stroke-opacity="0.6"/>
  <circle cx="256" cy="256" r="160" stroke="#22d3ee" stroke-width="4" stroke-dasharray="14 10" stroke-linecap="round"/>
  
  <!-- Middle Segmented Ring -->
  <circle cx="256" cy="256" r="130" stroke="#06b6d4" stroke-width="5" stroke-dasharray="28 14" stroke-opacity="0.85"/>
  <circle cx="256" cy="256" r="105" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Inner Core Reactor -->
  <circle cx="256" cy="256" r="85" fill="#082f49" stroke="#22d3ee" stroke-width="6"/>
  <circle cx="256" cy="256" r="70" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.8"/>

  <!-- Center 'J' Letter -->
  <text x="256" y="285" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="82" font-weight="900" fill="#e0f2fe" filter="drop-shadow(0 0 12px #22d3ee)">J</text>

  <!-- Arc Reactor Indicator Dots -->
  <circle cx="256" cy="80" r="5" fill="#22d3ee"/>
  <circle cx="256" cy="432" r="5" fill="#22d3ee"/>
  <circle cx="80" cy="256" r="5" fill="#22d3ee"/>
  <circle cx="432" cy="256" r="5" fill="#22d3ee"/>
</svg>
